# Урок 1 модуля 1. Источник — docs/content/lesson-01.md (черновик v1). Формул в базовом тексте нет.
id: m1_l01
moduleId: m1
order: 1
title: { ru: "Добро пожаловать в лабораторию" }
subtitle: { ru: "Вещества и их свойства" }
minutes: 15
stages:
  - { id: hook, label: { ru: "Крючок" } }
  - { id: try, label: { ru: "Попробуй сам" } }
  - { id: explain, label: { ru: "Разбираемся" } }
  - { id: mission, label: { ru: "Миссия" } }
  - { id: test, label: { ru: "Тест" } }
  - { id: home, label: { ru: "Дома" } }
  - { id: reward, label: { ru: "Награда" } }

screens:
  - id: k1
    stage: hook
    title: { ru: "Надписи смылись" }
    guide:
      pose: explain
      lines:
        - { ru: "Привет! Я Пипа. Я учёная, а это моя лаборатория." }
        - { ru: "Вчера я мыла полку. И смыла все надписи!" }
        - { ru: "Теперь у меня пять банок. В каждой — белый порошок." }
    blocks:
      - type: jars
        letters: ["А", "Б", "В", "Г", "Д"]

  - id: k2
    stage: hook
    title: { ru: "Как узнать, что в банке?" }
    guide:
      pose: thinking
      lines:
        - { ru: "Тут соль, сахар, пищевая сода, крахмал и мел. Но где что?" }
    blocks:
      - type: choice
        id: k2_how
        question: { ru: "Как узнать, что в банке?" }
        options:
          - { id: lick, label: { ru: "Лизнуть!" }, reply: { ru: "Ни за что! В лаборатории ничего не пробуют на вкус. Даже то, что похоже на сахар. Банки ведь могли перепутаться — как у меня сейчас." } }
          - { id: smell, label: { ru: "Понюхать" }, reply: { ru: "Хорошая мысль! Но эти порошки почти не пахнут. И нюхать надо по-особому — научу." } }
          - { id: look, label: { ru: "Рассмотреть" }, reply: { ru: "Отлично! Учёные всегда начинают с наблюдения. Но смотри: на вид они очень похожи…" } }
          - { id: unknown, label: { ru: "Не знаю" }, reply: { ru: "Я пока тоже не знаю! Разберёмся вместе." } }
        after:
          - { ru: "У каждого вещества есть свои приметы. Учёные называют их **свойствами**." }
          - { ru: "Найдём приметы — найдём, где что. Но сначала — разминка!" }

  - id: p1
    stage: try
    title: { ru: "Разминка: две пробирки" }
    lead: { ru: "На вид порошки одинаковые. Капни уксус в каждую." }
    guide:
      pose: explain
      lines:
        - { ru: "В двух пробирках — два белых порошка. Похожи?" }
    blocks:
      - type: goggles
        prompt: { ru: "Сначала — защитные очки. Нажми на них." }
      - type: predict
        id: p1_predict
        question: { ru: "Твоё предсказание: что будет от уксуса?" }
        options:
          - { id: nothing, label: { ru: "Ничего" } }
          - { id: fizz, label: { ru: "Зашипит" } }
          - { id: color, label: { ru: "Поменяет цвет" } }
          - { id: unknown, label: { ru: "Не знаю" } }
      - type: lab
        id: p1_lab
        vessels:
          - { label: "1", contents: [{ substance: table_salt, n: 1 }] }
          - { label: "2", contents: [{ substance: baking_soda, n: 1 }] }
        actions:
          - { id: v1, label: { ru: "Капнуть уксус в пробирку 1" }, icon: drag, vessel: 0, add: vinegar }
          - { id: v2, label: { ru: "Капнуть уксус в пробирку 2" }, icon: drag, vessel: 1, add: vinegar }
        tip: { ru: "Пипетка набирает жидкость и капает по капле." }
        done:
          - { ru: "Ого! На вид одинаковые. А ведут себя по-разному!" }
          - { ru: "В первой пробирке — соль. Во второй — пищевая сода." }
        predict:
          from: p1_predict
          match: fizz
          yes: { ru: "Есть! Предсказание сбылось — для второй пробирки." }
          no: { ru: "Неожиданно, правда? Учёные любят, когда опыт удивляет." }
    sci: [table_salt, baking_soda]
    deeper:
      title: { ru: "Копнуть глубже: откуда пузырьки?" }
      body:
        - { ru: "Пузырьки — это газ. Его не было ни в соде, ни в уксусе. Он появился, когда они встретились." }
        - { ru: "Когда одни вещества превращаются в другие, это называется **химическая реакция**." }
        - { ru: "Этот газ называется **углекислый**. Он же шипит в газировке." }
    next: { ru: "Почему так вышло? Давай разбираться." }

  - id: r1
    stage: explain
    title: { ru: "Вещество и предмет" }
    guide:
      pose: explain
      lines:
        - { ru: "Соль и сода — **вещества**. Вещество — это то, из чего сделаны вещи." }
        - { ru: "А сами вещи — **предметы**. Учёные называют их «тела». У предмета есть форма и размер." }
        - { ru: "Сосулька, снежинка и кубик льда — разные предметы. А вещество у них одно — вода." }
    blocks:
      - type: sort
        id: r1_sort
        prompt: { ru: "Разложи по полкам." }
        shelves:
          - { id: object, label: { ru: "Предмет" } }
          - { id: substance, label: { ru: "Вещество" } }
        cards:
          - { id: sugar_cube, label: { ru: "кубик сахара" }, shelf: object, wrong: { ru: "Кубик — это форма. У него есть размер. Значит, это предмет. А сделан он из вещества — сахара." } }
          - { id: sugar, label: { ru: "сахар" }, shelf: substance, wrong: { ru: "У сахара нет своей формы. Его можно насыпать в ложку, в банку, сделать из него кубик. Сахар — вещество." } }
          - { id: icicle, label: { ru: "сосулька" }, shelf: object, wrong: { ru: "Сосулька — предмет: у неё есть форма. Сделана она из воды." } }
          - { id: water, label: { ru: "вода" }, shelf: substance, wrong: { ru: "Вода может быть сосулькой, каплей, лужей. Вода — вещество." } }
          - { id: wire, label: { ru: "медная проволока" }, shelf: object, wrong: { ru: "Проволока — предмет. Вещество — медь, из которой её сделали." } }
          - { id: copper, label: { ru: "медь" }, shelf: substance, wrong: { ru: "Медь — вещество. Из меди делают проволоку, трубы, кастрюли." } }
          - { id: saltcellar, label: { ru: "солонка" }, shelf: object, wrong: { ru: "Солонка — предмет. Её делают из стекла, пластмассы или дерева." } }
          - { id: salt, label: { ru: "соль" }, shelf: substance, wrong: { ru: "Соль — вещество. Её насыпают в солонку, а солонка — предмет." } }
      - type: choice
        id: r1_q
        question: { ru: "Кубик сахара растолкли в порошок. Это всё ещё сахар?" }
        options:
          - { id: yes, label: { ru: "Да" }, correct: true, reply: { ru: "Верно! Поменялась форма. Вещество осталось тем же." } }
          - { id: no, label: { ru: "Нет" }, reply: { ru: "Сахар остался сахаром. Мы просто сломали кубик. Если предмет разбить, вещество не меняется." } }
    deeper:
      title: { ru: "Копнуть глубже: материалы и смеси" }
      body:
        - { ru: "Многие вещи сделаны не из одного вещества, а из смеси. Дерево, пластмасса и стекло — это **материалы**, в них много веществ." }
        - { ru: "Молоко — смесь воды, жира, сахара и других веществ. Воздух — смесь газов." }
        - { ru: "А любое вещество состоит из крошечных частиц. Их не видно даже в лупу. Про это — целый модуль впереди." }

  - id: r2
    stage: explain
    title: { ru: "Свойства — приметы вещества" }
    guide:
      pose: explain
      lines:
        - { ru: "У каждого вещества свои приметы. Учёные говорят — **свойства**." }
        - { ru: "По свойствам вещество можно узнать. Как друга по голосу." }
        - { ru: "Начнём с того, что видно глазом: цвет, блеск, форма крупинок." }
    blocks:
      - type: lab
        id: r2_lens
        vessels:
          - { label: "Соль", contents: [{ substance: table_salt, n: 1 }] }
          - { label: "Сода", contents: [{ substance: baking_soda, n: 1 }] }
        actions:
          - { id: l1, label: { ru: "Лупа: соль" }, icon: magnify, vessel: 0, magnify: true }
          - { id: l2, label: { ru: "Лупа: сода" }, icon: magnify, vessel: 1, magnify: true }
        tip: { ru: "Лупа увеличивает. В неё видно мелкие крупинки." }
        done:
          - { ru: "Крупинки соли — маленькие кубики! А сода — как мука. Крупинок не разглядеть." }
      - type: choice
        id: r2_q
        question: { ru: "Сода и мел — оба белые порошки. Можно отличить их только по цвету?" }
        options:
          - { id: yes, label: { ru: "Да" }, reply: { ru: "Цвет у них одинаковый — белый. По цвету не выйдет. Понадобится другое свойство. Какое — узнаешь в миссии!" } }
          - { id: no, label: { ru: "Нет, нужно другое свойство" }, correct: true, reply: { ru: "Точно! Одной приметы мало. Детективы собирают несколько." } }
    deeper:
      title: { ru: "Копнуть глубже: почему соль — кубики?" }
      body:
        - { ru: "Крошечные частицы соли встают ровными рядами, как кубики в коробке. Поэтому и крупинка растёт кубиком." }
        - { ru: "У сахара частицы другие, и кристаллы у него другой формы. Такие правильные крупинки называют **кристаллы**." }

  - id: r3
    stage: explain
    title: { ru: "Твёрдое, жидкое, газ" }
    guide:
      pose: explain
      lines:
        - { ru: "Ещё одно свойство: вещество твёрдое, жидкое или газ." }
        - { ru: "Соль — твёрдая. Уксус — жидкий. А в пузырьках из пробирки с содой был газ." }
        - { ru: "Газ — тоже вещество. Просто чаще всего его не видно." }
    blocks:
      - type: sort
        id: r3_sort
        prompt: { ru: "Разложи по полкам." }
        shelves:
          - { id: solid, label: { ru: "Твёрдое" } }
          - { id: liquid, label: { ru: "Жидкое" } }
          - { id: gas, label: { ru: "Газ" } }
        cards:
          - { id: salt, label: { ru: "соль" }, shelf: solid, wrong: { ru: "Порошок можно сыпать, почти как воду лить. Но каждая крупинка твёрдая. Порошок — это много твёрдых крупинок." } }
          - { id: ice, label: { ru: "лёд" }, shelf: solid, wrong: { ru: "Лёд — это вода, только твёрдая. Растает — станет жидкой." } }
          - { id: chalk, label: { ru: "мел" }, shelf: solid, wrong: { ru: "Порошок можно сыпать, почти как воду лить. Но каждая крупинка твёрдая." } }
          - { id: vinegar, label: { ru: "уксус" }, shelf: liquid, wrong: { ru: "Его можно налить, и он растекается. Значит, жидкий." } }
          - { id: water, label: { ru: "вода" }, shelf: liquid, wrong: { ru: "Её можно налить, и она растекается. Значит, жидкая." } }
          - { id: oil, label: { ru: "растительное масло" }, shelf: liquid, wrong: { ru: "Его можно налить, и оно растекается. Значит, жидкое." } }
          - { id: bubbles, label: { ru: "газ из пузырьков" }, shelf: gas, wrong: { ru: "Внутри пузырька — газ. Поэтому пузырёк лёгкий и всплывает." } }
          - { id: air, label: { ru: "воздух в шарике" }, shelf: gas, wrong: { ru: "Воздух не видно, но он есть: надуй шарик — и шарик станет круглым. Воздух — газ." } }
      - type: choice
        id: r3_q
        question: { ru: "Лёд растаял. Получилась вода. Вещество стало другим?" }
        options:
          - { id: same, label: { ru: "Нет, это та же вода" }, correct: true, reply: { ru: "Верно! Вещество то же. Изменилось только **состояние**: было твёрдое, стало жидкое." } }
          - { id: other, label: { ru: "Да, другое" }, reply: { ru: "Это всё та же вода. Её можно снова заморозить и получить лёд. Изменилось только состояние." } }
    deeper:
      title: { ru: "Копнуть глубже: частицы и пар" }
      body:
        - { ru: "Учёные называют это **агрегатное состояние**." }
        - { ru: "В твёрдом веществе частицы стоят тесно и только дрожат на месте. В жидком — скользят друг мимо друга. В газе — разлетаются во все стороны." }
        - { ru: "Хитрость: белое облачко над чайником — это не пар. Это крошечные капельки воды. Настоящий водяной пар невидим!" }

  - id: r4
    stage: explain
    title: { ru: "Запах и вкус: как проверять правильно" }
    guide:
      pose: explain
      lines:
        - { ru: "Запах — тоже свойство. Но нюхать в лаборатории надо по-особому." }
    blocks:
      - type: choice
        id: r4_how
        question: { ru: "Понюхай уксус. Как будешь нюхать?" }
        options:
          - { id: lean, label: { ru: "Наклониться и вдохнуть" }, reply: { ru: "Стоп! Если вещество едкое, так можно обжечь нос. Давай по-учёному: помаши ладонью к себе." } }
          - { id: fan, label: { ru: "Помахать ладонью к себе" }, correct: true, reply: { ru: "Точно! Так учёные и нюхают. Пахнет кисло и резко. Это уксус." } }
        art: fan
      - type: rule
        title: { ru: "Как нюхать" }
        lines:
          - { ru: "Не наклоняйся над сосудом." }
          - { ru: "Помаши ладонью от сосуда к носу." }
          - { ru: "Вдохни чуть-чуть, не глубоко." }
          - { ru: "Незнакомое не нюхаем совсем." }
      - type: lab
        id: r4_smell
        vessels:
          - { label: "Соль", contents: [{ substance: table_salt, n: 1 }] }
          - { label: "Сода", contents: [{ substance: baking_soda, n: 1 }] }
        actions:
          - { id: s1, label: { ru: "Понюхать соль" }, icon: smell, vessel: 0, smell: true }
          - { id: s2, label: { ru: "Понюхать соду" }, icon: smell, vessel: 1, smell: true }
        done:
          - { ru: "Почти ничем не пахнут. По запаху их не отличить." }
          - { ru: "А вкус? Вкус — тоже свойство. Но в лаборатории ничего не пробуют на вкус. Никогда. Даже сахар." }
      - type: choice
        id: r4_taste
        question: { ru: "Ты в лаборатории. В банке, похоже, сахар. Можно лизнуть чуть-чуть?" }
        options:
          - { id: bit, label: { ru: "Можно, если чуть-чуть" }, reply: { ru: "Даже чуть-чуть нельзя. Некоторые вещества опасны даже в крошечной капле." } }
          - { id: sure, label: { ru: "Можно, если это точно сахар" }, reply: { ru: "А вдруг банки перепутали, как у Пипы? И посуда в лаборатории может быть грязной от других опытов." } }
          - { id: never, label: { ru: "Нельзя" }, correct: true, reply: { ru: "Верно! В лаборатории вкус не проверяют никогда." } }
    deeper:
      title: { ru: "Копнуть глубже: почему запах летит?" }
      body:
        - { ru: "Крошечные частицы вещества улетают в воздух и долетают до носа." }
        - { ru: "Некоторые вещества пахнут так резко, что могут обжечь нос и глаза. Например, нашатырный спирт. Поэтому нюхаем только «веером»." }

  - id: r5
    stage: explain
    title: { ru: "Растворяется или нет" }
    guide:
      pose: explain
      lines:
        - { ru: "Последнее свойство на сегодня: растворяется ли вещество в воде." }
    blocks:
      - type: lab
        id: r5_lab
        vessels:
          - { label: "Соль", contents: [{ substance: table_salt, n: 1 }, { substance: water, n: 2 }] }
          - { label: "Песок", contents: [{ substance: sand, n: 1 }, { substance: water, n: 2 }] }
        actions:
          - { id: m1, label: { ru: "Перемешать соль" }, icon: stir, vessel: 0, stir: true }
          - { id: m2, label: { ru: "Перемешать песок" }, icon: stir, vessel: 1, stir: true }
        tip: { ru: "Стеклянной палочкой перемешивают." }
        done:
          - { ru: "Соль растворилась. Песок — нет." }
      - type: choice
        id: r5_q
        question: { ru: "Куда делась соль?" }
        options:
          - { id: gone, label: { ru: "Исчезла совсем" }, reply: { ru: "Соль никуда не исчезла! Если выпарить воду, соль вернётся. Её просто не видно." } }
          - { id: particles, label: { ru: "Распалась на крошечные частицы, они в воде" }, correct: true, reply: { ru: "Верно! Соль спряталась в воде. Её не видно, но она там." } }
          - { id: water, label: { ru: "Превратилась в воду" }, reply: { ru: "Соль не стала водой. Она перемешалась с водой — на крошечные частицы." } }
      - type: rule
        title: { ru: "Примета" }
        lines:
          - { ru: "**Растворилось** — вода прозрачная, крупинок не видно." }
          - { ru: "**Не растворилось** — крупинки лежат на дне или вода мутная, как молоко." }
    deeper:
      title: { ru: "Копнуть глубже: у растворения есть предел" }
      body:
        - { ru: "Раствор бывает цветным, но он всегда прозрачный: сквозь него всё видно. А мутная вода — это целые крупинки, которые плавают в воде." }
        - { ru: "В стакан воды можно растворить около 70 граммов соли — и целых 400 граммов сахара! Если насыпать больше, остаток ляжет на дно." }
    next: { ru: "Ты знаешь всё, чтобы стать детективом. Почти всё. Остались правила лаборатории!" }

  - id: m0
    stage: mission
    title: { ru: "Пропуск в лабораторию" }
    guide:
      pose: explain
      lines:
        - { ru: "Это Винтик, мой новый помощник. Он ещё не знает правил." }
        - { ru: "Найди 6 ошибок — и получишь пропуск в лабораторию!" }
    blocks:
      - type: spot
        id: m0_spot
        cards:
          - { id: goggles, art: vintik_no_goggles, mistake: true, label: { ru: "Винтик без очков" }, rule: { ru: "Очки — первым делом. Глаза берегут один раз и на всю жизнь." } }
          - { id: cookie, art: vintik_cookie, mistake: true, label: { ru: "Винтик ест печенье за столом" }, rule: { ru: "В лаборатории не едят и не пьют." } }
          - { id: sniff, art: vintik_sniff, mistake: true, label: { ru: "Винтик нюхает, наклонившись над колбой" }, rule: { ru: "Нюхаем только веером: ладонью к себе." } }
          - { id: fan, art: fan, mistake: false, label: { ru: "Пипа нюхает веером" }, rule: { ru: "Тут всё правильно: ладонью от сосуда к носу." } }
          - { id: hand_fire, art: tube_hand, mistake: true, label: { ru: "Пробирка над огнём в руке" }, rule: { ru: "Горячую пробирку держим держателем. Отверстием — от себя и от других." } }
          - { id: holder, art: tube_holder, mistake: false, label: { ru: "Пробирка в держателе" }, rule: { ru: "Тут всё правильно: держатель и отверстие от людей." } }
          - { id: nolabel, art: jar_nolabel, mistake: true, label: { ru: "Банка без надписи" }, rule: { ru: "На каждой банке — надпись. Банку без надписи не открываем: отдаём взрослому." } }
          - { id: puddle, art: puddle, mistake: true, label: { ru: "Лужица на столе" }, rule: { ru: "Пролил — скажи взрослому и вытри." } }
          - { id: pipa, art: pipa_goggles, mistake: false, label: { ru: "Пипа в очках" }, rule: { ru: "Тут всё правильно: очки на месте." } }
        done:
          - { ru: "Пропуск твой! В виртуальной лабе нельзя обжечься или отравиться. Но правила здесь — как в настоящей." }
          - { ru: "Опыты с пометкой «только в виртуальной лабе» дома не повторяем." }

  - id: m1
    stage: mission
    title: { ru: "Загадка белых порошков" }
    guide:
      pose: happy
      lines:
        - { ru: "Пять банок ждут надписей. Каждую надпись докажи опытом!" }
    blocks:
      - type: mission
        missionId: powder_mystery

  - id: test
    stage: test
    title: { ru: "Тест" }
    blocks: [{ type: test }]

  - id: home
    stage: home
    title: { ru: "Попробуй дома со взрослыми" }
    blocks: [{ type: home }]

  - id: reward
    stage: reward
    title: { ru: "Награда" }
    blocks: [{ type: reward }]

test:
  intro: { ru: "Ошибаться не страшно: после ответа объясню, а ответить можно снова." }
  summary: { ru: "Ты знаешь уже {count} из {total}!" }
  questions:
    - id: t1
      type: sort
      prompt: { ru: "Разложи карточки: предмет или вещество?" }
      shelves:
        - { id: object, label: { ru: "Предмет" } }
        - { id: substance, label: { ru: "Вещество" } }
      cards:
        - { id: crayon, label: { ru: "мелок" }, shelf: object, wrong: { ru: "Мелок — предмет: палочка с формой и размером. А вещество, из которого он сделан, — мел или гипс." } }
        - { id: chalk, label: { ru: "мел" }, shelf: substance, wrong: { ru: "Мел — вещество. Из него делают мелки, а можно растолочь его в порошок." } }
        - { id: spoon, label: { ru: "алюминиевая ложка" }, shelf: object, wrong: { ru: "Ложка — предмет. Вещество — алюминий, из которого её сделали." } }
        - { id: aluminium, label: { ru: "алюминий" }, shelf: substance, wrong: { ru: "Алюминий — вещество. Из него делают ложки, банки, фольгу." } }
        - { id: drop, label: { ru: "капля воды" }, shelf: object, wrong: { ru: "Капля — предмет: у неё есть форма и размер. Сделана она из вещества — воды." } }
        - { id: water, label: { ru: "вода" }, shelf: substance, wrong: { ru: "Вода может быть каплей, лужей, сосулькой. Своей формы у неё нет. Вода — вещество." } }
        - { id: snowman, label: { ru: "снеговик" }, shelf: object, wrong: { ru: "Снеговик — предмет. Он сделан из снега, а снег — замёрзшая вода." } }
        - { id: sugar, label: { ru: "сахар" }, shelf: substance, wrong: { ru: "Сахар — вещество. Из него можно сделать кубик или леденец." } }
    - id: t2
      type: single
      prompt: { ru: "Что НЕ является свойством вещества?" }
      options:
        - { id: a, label: { ru: "цвет" }, explain: { ru: "Цвет — свойство вещества. Медь рыжеватая и в проволоке, и в трубе." } }
        - { id: b, label: { ru: "растворяется ли в воде" }, explain: { ru: "Растворимость — свойство вещества. Соль растворяется в воде, откуда её ни возьми." } }
        - { id: c, label: { ru: "размер" }, correct: true, explain: { ru: "Верно! Размер — свойство предмета. Кубик сахара бывает большой и маленький, а сахар — всё тот же сахар." } }
        - { id: d, label: { ru: "запах" }, explain: { ru: "Запах — свойство вещества. Уксус пахнет кисло из любой бутылки." } }
    - id: t3
      type: sort
      prompt: { ru: "Твёрдое, жидкое или газ?" }
      shelves:
        - { id: solid, label: { ru: "Твёрдое" } }
        - { id: liquid, label: { ru: "Жидкое" } }
        - { id: gas, label: { ru: "Газ" } }
      cards:
        - { id: ice, label: { ru: "лёд" }, shelf: solid, wrong: { ru: "Лёд — это вода в твёрдом состоянии. Растает — станет жидкой." } }
        - { id: chalk, label: { ru: "мел" }, shelf: solid, wrong: { ru: "Порошок мела сыплется, но каждая крупинка твёрдая." } }
        - { id: vinegar, label: { ru: "уксус" }, shelf: liquid, wrong: { ru: "Его можно налить, он растекается. Значит, жидкий." } }
        - { id: oil, label: { ru: "растительное масло" }, shelf: liquid, wrong: { ru: "Его можно налить, оно растекается. Значит, жидкое." } }
        - { id: co2, label: { ru: "углекислый газ из пузырьков" }, shelf: gas, wrong: { ru: "Подсказка — в названии! Он внутри пузырьков, поэтому они всплывают." } }
        - { id: air, label: { ru: "воздух" }, shelf: gas, wrong: { ru: "Воздух не видно, но он есть: он надувает шарик. Воздух — газ, точнее, смесь газов." } }
    - id: t4
      type: single
      prompt: { ru: "Как правильно понюхать вещество в лаборатории?" }
      options:
        - { id: a, label: { ru: "наклониться и глубоко вдохнуть" }, explain: { ru: "Если вещество едкое, так можно обжечь нос. Над сосудом не наклоняемся." } }
        - { id: b, label: { ru: "помахать ладонью от сосуда к носу" }, correct: true, explain: { ru: "Верно! Это способ «веером». Запаха доходит чуть-чуть — ровно столько, сколько нужно." } }
        - { id: c, label: { ru: "насыпать на ладонь и поднести к носу" }, explain: { ru: "Вещества в лаборатории руками не берём: можно испачкаться или обжечься." } }
        - { id: d, label: { ru: "в лаборатории нюхать нельзя совсем" }, explain: { ru: "Нюхать можно — но только веером и только когда разрешил учитель или взрослый. А незнакомое не нюхаем совсем." } }
    - id: t5
      type: match
      prompt: { ru: "Соедини прибор и его работу." }
      pairs:
        - { id: pipette, left: { ru: "Пипетка" }, right: { ru: "капать по капле" }, wrong: { ru: "Пипеткой набирают жидкость и капают по капле." } }
        - { id: holder, left: { ru: "Держатель" }, right: { ru: "держать пробирку над огнём" }, wrong: { ru: "Держатель держит горячую пробирку, чтобы руки были подальше от огня." } }
        - { id: lens, left: { ru: "Лупа" }, right: { ru: "рассмотреть мелкие крупинки" }, wrong: { ru: "Лупа увеличивает. В неё видно, что соль — кубики." } }
        - { id: goggles, left: { ru: "Защитные очки" }, right: { ru: "беречь глаза" }, wrong: { ru: "Очки защищают глаза от брызг. Их надевают первым делом." } }
        - { id: rod, left: { ru: "Стеклянная палочка" }, right: { ru: "перемешивать" }, wrong: { ru: "Палочкой мешают — так вещество быстрее растворяется." } }
    - id: t6
      type: predict
      prompt: { ru: "В пробирку с водой насыпали соль и перемешали. Что увидим?" }
      art: salt_water
      options:
        - { id: a, label: { ru: "вода прозрачная, соли не видно" }, correct: true, explain: { ru: "Верно! Соль растворилась. Она не исчезла: её можно вернуть, если выпарить воду." } }
        - { id: b, label: { ru: "вода мутная, как молоко" }, explain: { ru: "Мутной вода бывает, когда порошок НЕ растворяется — как крахмал или мел. А соль растворяется." } }
        - { id: c, label: { ru: "появились пузырьки" }, explain: { ru: "Пузырьки появляются, когда выходит газ. Соль с водой газ не даёт." } }
        - { id: d, label: { ru: "вода посинела" }, explain: { ru: "Синеет крахмал от йода. А тут нет ни крахмала, ни йода." } }
    - id: t7
      type: predict
      prompt: { ru: "Капнули раствор йода на крахмал и на соль. Что увидим?" }
      art: iodine
      options:
        - { id: a, label: { ru: "крахмал тёмно-синий, соль жёлто-коричневая" }, correct: true, explain: { ru: "Верно! Синеет только крахмал. На соли йод остаётся своего цвета." } }
        - { id: b, label: { ru: "оба посинеют" }, explain: { ru: "Йод синеет только с крахмалом. В соли крахмала нет." } }
        - { id: c, label: { ru: "соль посинеет, крахмал нет" }, explain: { ru: "Наоборот! Синий цвет — примета крахмала." } }
        - { id: d, label: { ru: "оба зашипят" }, explain: { ru: "Шипение — это газ. Йод с этими веществами газ не даёт." } }
    - id: t8
      type: multi
      prompt: { ru: "Как отличить соль от сахара, не пробуя на вкус? Выбери все верные ответы." }
      partial: { ru: "Верно! Но есть ещё один способ. Найдёшь?" }
      options:
        - { id: a, label: { ru: "рассмотреть в лупу" }, correct: true, explain: { ru: "Да! Соль — кубики, у сахара кристаллы другой формы." } }
        - { id: b, label: { ru: "нагреть" }, correct: true, explain: { ru: "Да! Сахар расплавится и запахнет карамелью, а соль не изменится." } }
        - { id: c, label: { ru: "капнуть уксусом" }, explain: { ru: "И соль, и сахар с уксусом не шипят. Этот способ их не различит." } }
        - { id: d, label: { ru: "капнуть йодом" }, explain: { ru: "Ни соль, ни сахар от йода не синеют: крахмала в них нет." } }
    - id: t9
      type: single
      prompt: { ru: "Сода и мел шипят от уксуса. Как их различить?" }
      options:
        - { id: a, label: { ru: "налить воды и перемешать" }, correct: true, explain: { ru: "Верно! Сода растворится, а мел — нет: вода станет мутной." } }
        - { id: b, label: { ru: "капнуть ещё уксуса" }, explain: { ru: "Оба снова зашипят. Нужен опыт, где они ведут себя по-разному." } }
        - { id: c, label: { ru: "посмотреть на цвет" }, explain: { ru: "Оба белые. По цвету не различить." } }
        - { id: d, label: { ru: "понюхать" }, explain: { ru: "Оба почти не пахнут." } }
    - id: t10
      type: single
      prompt: { ru: "Дома на полке стоит банка без надписи. Внутри белый порошок. Что сделать?" }
      options:
        - { id: a, label: { ru: "лизнуть чуть-чуть" }, explain: { ru: "Никогда! В банке может быть что угодно — даже средство для чистки." } }
        - { id: b, label: { ru: "проверить, как в лабе: водой и уксусом" }, explain: { ru: "В лабе Пипа знала, что все порошки безопасные. Дома так не бывает. Неизвестное вещество может быть опасным, и смешивать его с чем-то тоже опасно." } }
        - { id: c, label: { ru: "не открывать и показать взрослому" }, correct: true, explain: { ru: "Верно! Неподписанное не трогаем. Взрослый разберётся." } }
        - { id: d, label: { ru: "понюхать веером" }, explain: { ru: "Незнакомое не нюхаем совсем, даже веером." } }

home:
  title: { ru: "Кухонный детектив" }
  intro: { ru: "Повторяем часть миссии с настоящими кухонными порошками. Взрослый прячет ответ, ты разгадываешь. Без огня и без йода." }
  meta: { ru: "15 минут · с 9 лет · только вместе со взрослым" }
  materials:
    - { ru: "Соль, сахарный песок, пищевая сода, крахмал — по 1 чайной ложке. Взрослый берёт их только из подписанных пачек." }
    - { ru: "4 прозрачных стаканчика и 4 блюдца." }
    - { ru: "Вода комнатной температуры." }
    - { ru: "Столовый уксус 6 % или 9 % — немного, в маленькой чашке. Его держит и наливает взрослый." }
    - { ru: "Чайная ложка; палочки или ложечки для перемешивания." }
    - { ru: "Лупа, если есть. Можно камеру телефона с увеличением." }
    - { ru: "Поднос или клеёнка, бумажные полотенца." }
    - { ru: "Листок с таблицей: строки А, Б, В, Г и столбцы «Как выглядит», «Вода», «Уксус»." }
  steps:
    - { ru: "Взрослый готовит загадку. Насыпает по ½ чайной ложки каждого порошка в стаканчик и ещё по ½ ложки на блюдце. Подписывает стаканчик и блюдце одной буквой. Ответ записывает и прячет." }
    - { ru: "Смотрим. Рассмотри порошки на блюдцах (в лупу, если есть) и запиши: «кубики», «кристаллы», «мелкий порошок»." }
    - { ru: "Проверка водой. В каждый стаканчик налить по 4 столовые ложки воды и перемешивать около минуты. Записать: «растворилось» или «мутно»." }
    - { ru: "Проверка уксусом. Взрослый наливает по чайной ложке уксуса на каждую кучку на блюдцах. Шипит или нет? Записать." }
    - { ru: "Вывод. По таблице реши, где что. Открой листок взрослого и сверь." }
    - { ru: "Уборка. Всё смыть в раковину водой, протереть стол, вымыть руки." }
  expectedTitle: { ru: "Что должно получиться (подсказка для взрослого)" }
  columns: [{ ru: "Порошок" }, { ru: "Как выглядит" }, { ru: "Вода" }, { ru: "Уксус" }]
  rows:
    - [{ ru: "Соль" }, { ru: "кубики" }, { ru: "растворилась" }, { ru: "не шипит" }]
    - [{ ru: "Сахар" }, { ru: "кристаллы, не кубики" }, { ru: "растворился" }, { ru: "не шипит" }]
    - [{ ru: "Сода" }, { ru: "мелкий порошок" }, { ru: "растворилась медленнее" }, { ru: "шипит, пенится" }]
    - [{ ru: "Крахмал" }, { ru: "очень мелкий порошок" }, { ru: "мутно, потом оседает" }, { ru: "не шипит" }]
  notes:
    - { ru: "Кубики лучше всего видны у мелкой соли «Экстра». Если лупы нет, честно скажите: «Нам не хватило прибора — у учёных так тоже бывает». Пробовать на вкус для проверки нельзя." }
    - { ru: "Дополнительно: капните уксусом на кусочек скорлупы от варёного яйца. Появятся мелкие пузырьки: в скорлупе то же вещество, что в природном меле." }
  safety:
    - { ru: "Взрослый рядом всё время. Уксус наливает взрослый." }
    - { ru: "Только столовый уксус 6–9 %. Уксусная эссенция — не для опытов: она вызывает тяжёлые ожоги. Её держат подальше от детей." }
    - { ru: "Ничего не пробуем на вкус, даже кухонные продукты. После опыта ничего не едим, всё выливаем." }
    - { ru: "Не трём глаза. Если уксус попал в глаз — сразу промыть большим количеством проточной воды и сказать взрослому." }
    - { ru: "Не делаем опыт в закрытой бутылке или банке с крышкой: газ может выбить крышку." }
    - { ru: "Ничего не добавляем из бытовой химии. Чистящие средства никогда не смешивают ни между собой, ни с уксусом." }
    - { ru: "Используем только порошки из подписанных пачек. Неизвестный порошок не трогаем." }
    - { ru: "После опыта — вымыть руки и протереть стол." }

reward:
  badge: powder-detective
  title: { ru: "Значок «Сыщик порошков»" }
  text: { ru: "Урок пройден! Теперь в песочнице открыты новые вещества и приборы." }
  ideas:
    - { ru: "Смешай крахмал с водой и нагрей. Что получится?" }
    - { ru: "Выпари солёную воду. Вернётся ли соль?" }
    - { ru: "Что будет, если капнуть йод на кисель из крахмала?" }
